version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Route updates to a staging branch so they can be tested before merging to main.
    target-branch: "dependabot-reqs"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: "dependabot-reqs"
