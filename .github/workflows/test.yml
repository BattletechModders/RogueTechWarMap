name: Test

on:
  push:
    branches: [main, system-state-nyx]
  pull_request:
    branches: [main, system-state-nyx]

jobs:
  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JSON syntax
        run: |
          python3 .github/scripts/validate_json.py

  test:
    name: Vitest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck app sources
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck test sources
        run: npx tsc -p tsconfig.vitest.json --noEmit

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Build production bundle
        run: yarn build
        env:
          VITE_BASE_URL: /

      - name: Verify Tailwind utilities are emitted
        # Regression gate for the 2026-05-17 black-map incident: dependabot bumped
        # tailwindcss v3 -> v4, PostCSS silently dropped every utility, and the
        # Konva stage collapsed to 0x0. Fail loudly if utilities are missing.
        run: |
          css=$(ls dist/assets/*.css 2>/dev/null | head -1)
          if [ -z "$css" ]; then
            echo "FAIL: no CSS bundle found in dist/assets/"
            exit 1
          fi
          missing=0
          for util in '\.w-full' '\.h-full' '\.flex' '\.text-center'; do
            if ! grep -q "$util" "$css"; then
              echo "FAIL: utility \"$util\" missing from $css"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "OK: Tailwind utilities present in $css"

      - name: Upload coverage report
        if: matrix.node == '20'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
